# Matrix scan settle time (microseconds).
#
# The default of 0 makes ZMK read the row inputs immediately after driving a
# column output. On a fully-populated board the longer/high-capacitance column
# lines have not finished charging yet, so presses on those intersections are
# read as "not pressed" and dropped on every scan pass. Giving the lines time
# to settle before reading (and to discharge between columns) makes every
# intersection register reliably.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=250
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=100
